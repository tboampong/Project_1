<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121f">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10121f;
      color: #f7f5ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      overflow-y: auto;
      background:
        radial-gradient(ellipse at 20% 15%, #6045c833, transparent 42%),
        radial-gradient(ellipse at 85% 85%, #1bb6a522, transparent 40%),
        #10121f;
    }
    .scene { position: relative; width: min(100% - 2rem, 760px); }
    .site-nav { display: flex; justify-content: flex-end; gap: 1.25rem; margin: 0 0 1rem; }
    .site-nav a { color: #c4c2d3; text-decoration: none; font-size: .9rem; }
    .site-nav a:hover, .site-nav a:focus-visible { color: #7ce8d0; }
    .orb {
      position: absolute;
      width: 190px;
      aspect-ratio: 1;
      top: -72px;
      right: 5%;
      border-radius: 50%;
      background: linear-gradient(135deg, #b79aff, #5d7cff 55%, #52e0c0);
      filter: blur(1px);
      opacity: .9;
      box-shadow: 0 0 90px #8c72ff55;
      animation: float 7s ease-in-out infinite;
    }
    .card {
      position: relative;
      padding: clamp(2rem, 7vw, 4.5rem);
      border: 1px solid #ffffff20;
      border-radius: 28px;
      background: linear-gradient(145deg, #ffffff12, #ffffff06);
      box-shadow: 0 28px 90px #0006, inset 0 1px #ffffff16;
      backdrop-filter: blur(18px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.5rem;
      color: #b9b5d1;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .spark { color: #7ce8d0; font-size: 1.1rem; }
    h1 {
      margin: 0;
      font-size: clamp(3.5rem, 11vw, 7.2rem);
      line-height: .95;
      letter-spacing: -.075em;
      font-weight: 800;
    }
    h1 span {
      display: block;
      padding: .08em 0 .16em;
      color: transparent;
      background: linear-gradient(100deg, #bca9ff 8%, #8eaaff 52%, #70e5cb 100%);
      background-clip: text;
      -webkit-background-clip: text;
    }
    .intro {
      max-width: 38rem;
      margin: 1.5rem 0 0;
      color: #c4c2d3;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.75;
    }
    .rule {
      width: 64px;
      height: 3px;
      margin-top: 2.25rem;
      border-radius: 9px;
      background: linear-gradient(90deg, #a994ff, #65dfc8);
    }
    @keyframes float { 50% { transform: translate3d(-12px, 16px, 0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="scene">
    <nav class="site-nav" aria-label="Main navigation"><a href="about.html">About</a><a href="contact.html">Contact</a></nav>
    <div class="orb" aria-hidden="true"></div>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow"><span class="spark" aria-hidden="true">✦</span> A little something to start</p>
      <h1 id="title">Hello,<span>world!</span></h1>
      <p class="intro">Every great idea begins with a first line. Here’s to wherever this one takes you.</p>
      <div class="rule" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
