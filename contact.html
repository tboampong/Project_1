<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121f">
  <title>Contact | Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #10121f; color: #f7f5ff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem 1rem; background: radial-gradient(ellipse at 20% 15%, #6045c833, transparent 42%), radial-gradient(ellipse at 85% 85%, #1bb6a522, transparent 40%), #10121f; }
    .scene { width: min(100%, 760px); }
    nav { display: flex; justify-content: flex-end; gap: 1.25rem; margin-bottom: 1rem; }
    nav a { color: #c4c2d3; text-decoration: none; font-size: .9rem; }
    nav a:hover, nav a:focus-visible { color: #7ce8d0; }
    .card { padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid #ffffff20; border-radius: 28px; background: linear-gradient(145deg, #ffffff12, #ffffff06); box-shadow: 0 28px 90px #0006, inset 0 1px #ffffff16; backdrop-filter: blur(18px); }
    .eyebrow { margin: 0 0 1.5rem; color: #b9b5d1; font-size: .76rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 10vw, 6rem); line-height: .98; letter-spacing: -.07em; }
    h1 span { color: transparent; background: linear-gradient(100deg, #bca9ff, #70e5cb); background-clip: text; -webkit-background-clip: text; }
    .intro { max-width: 40rem; margin: 1.5rem 0 0; color: #c4c2d3; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.75; }
    .rule { width: 64px; height: 3px; margin-top: 2.25rem; border-radius: 9px; background: linear-gradient(90deg, #a994ff, #65dfc8); }
    .links { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 2rem; }
    .button { display: inline-block; padding: .8rem 1.1rem; border: 1px solid #ffffff24; border-radius: 999px; color: #f7f5ff; text-decoration: none; }
    .button.primary { border-color: transparent; color: #10121f; background: linear-gradient(100deg, #bca9ff, #70e5cb); font-weight: 700; }
  </style>
</head>
<body>
  <main class="scene">
    <nav aria-label="Main navigation"><a href="hello-world.html">Home</a><a href="about.html">About</a></nav>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">Questions, ideas, or just saying hello?</p>
      <h1 id="title">Let’s <span>talk.</span></h1>
      <p class="intro">Have something you’d like to share? We’d love to hear from you. Send a note and we’ll pick up the conversation.</p>
      <div class="rule" aria-hidden="true"></div>
      <div class="links"><a class="button primary" href="mailto:hello@example.com">Email us</a><a class="button" href="about.html">Learn about us</a></div>
    </section>
  </main>
</body>
</html>
